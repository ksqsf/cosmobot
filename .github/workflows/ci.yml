name: CI

on:
  push:
  pull_request:

jobs:
  cabal:
    name: Cabal
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.14.2.0"

      - name: Cache Cabal
        uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.10.3-cabal-${{ hashFiles('cabal.project', 'cosmobot/cosmobot.cabal', 'cosmocode/cosmocode.cabal') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.10.3-cabal-

      - name: Update package index
        run: cabal update

      - name: Install sandbox dependencies
        run: |
          sudo apt-get install --yes bubblewrap libsystemd-dev
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build
        run: cabal build -j all --enable-tests --enable-benchmarks

      - name: Test
        run: cabal test -j all --test-options=--hide-successes

      - name: Package executable
        run: |
          mkdir -p output
          install -m 0755 "$(cabal list-bin exe:cosmobot)" output/cosmobot
          cd output
          strip cosmobot
          tar -czf cosmobot-linux-x86_64.tar.gz cosmobot

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: cosmobot-linux-x86_64
          path: cosmobot-linux-x86_64.tar.gz
          if-no-files-found: error
