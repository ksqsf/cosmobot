name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cosmoscope

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cosmoscope/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end test
        run: npm run test:e2e

  cabal:
    name: Cabal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.14.2.0"

      - name: Cache Cabal
        uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.10.3-cabal-${{ hashFiles('cabal.project', 'cosmobot/cosmobot.cabal', 'cosmocode/cosmocode.cabal') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.10.3-cabal-

      - name: Update package index
        run: cabal update

      - name: Install sandbox dependencies
        run: |
          sudo apt-get install --yes bubblewrap libsystemd-dev
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build
        run: cabal build -j all --enable-tests --enable-benchmarks

      - name: Test
        run: cabal test -j all --test-options=--hide-successes
